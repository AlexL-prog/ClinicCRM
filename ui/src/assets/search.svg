<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Поиск">
  <defs>
    <!-- Градиент фона -->
    <linearGradient id="btnGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    
    <!-- Мягкая тень -->
    <filter id="btnShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1d4ed8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Подложка кнопки (скруглённый квадрат) -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#btnGradient)" filter="url(#btnShadow)" />

  <!-- Иконка лупы -->
  <g stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none">
    <circle cx="28" cy="28" r="10" />
    <line x1="35.5" y1="35.5" x2="45" y2="45" />
  </g>
</svg>
